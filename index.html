<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
        }

        img {
            width: 250px;
            height: auto;
            margin: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h2>Random Pictures</h2>

    <div id="gallery"></div>

    <script>
        // List of images inside "images" folder
        const images = [
            "1.jpg",
            "2.jpg",
			"3.jpg",
			"4.jpg",
			"5.jpg",
			"6.jpg",
			"7.jpg",
			"8.jpg",
			"9.jpg",
			"10.jpg",
			"11.jpg",
			"12.jpg",
			"13.jpg",
			"14.jpg",
			"15.jpg",
			"16.jpg",
			"17.jpg",
			"18.jpg",
			"19.jpg",
			"20.jpg",
			"21.jpg",
            "22.jpg"
        ];

        // Shuffle images
        images.sort(() => 0.5 - Math.random());

        // Take first 3 images
        const selected = images.slice(0, 3);

        // Display images
        const gallery = document.getElementById("gallery");

        selected.forEach(img => {
            const image = document.createElement("img");
            image.src = img;
            gallery.appendChild(image);
        });
    </script>

</body>
</html>
